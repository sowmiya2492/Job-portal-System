<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications | JobPortal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: white;
            padding: 17px 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        .navbar-brand {
            font-size: 27px;
            font-weight: 700;
            color: #2563eb !important;
            text-decoration: none;
        }

        .navbar-brand i {
            margin-right: 6px;
        }

        .nav-link {
            color: #475569;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #2563eb;
        }

        .page-section {
            padding: 55px 0;
            min-height: calc(100vh - 150px);
        }

        .page-title {
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
        }

        .application-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 7px 22px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .application-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .job-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .job-title {
            font-size: 21px;
            font-weight: 700;
        }

        .job-info {
            color: #64748b;
            margin-top: 8px;
            font-size: 14px;
        }

        .job-info i {
            color: #2563eb;
            margin-right: 6px;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-review {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .resume-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 14px;
            color: #475569;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
        }

        .resume-box i {
            color: #dc2626;
            margin-right: 6px;
        }

        .date {
            color: #64748b;
            font-size: 14px;
        }

        .empty-box {
            background: white;
            border-radius: 16px;
            padding: 70px 20px;
            text-align: center;
            border: 1px solid #e5e7eb;
            box-shadow: 0 7px 22px rgba(0,0,0,0.04);
        }

        .empty-box i {
            font-size: 55px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .empty-box h3 {
            font-weight: 700;
        }

        .empty-box p {
            color: #64748b;
        }

        .browse-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .browse-btn:hover {
            background: #1d4ed8;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 70px 20px;
            color: #64748b;
        }

        .loading i {
            font-size: 35px;
        }

        .error-box {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        footer {
            background: #0f172a;
            color: white;
            padding: 30px 0;
        }

        footer p {
            color: #94a3b8;
            margin: 0;
        }

        @media (max-width: 768px) {

            .page-section {
                padding: 35px 15px;
            }

            .page-title h1 {
                font-size: 30px;
            }

            .nav-link {
                display: none;
            }

        }

    </style>

<link rel="stylesheet" href="css/ui-polish.css">
</head>


<body class="jp-reveal">


<!-- Navbar -->

<nav class="navbar">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center">

            <a href="index.html" class="navbar-brand">

                <i class="bi bi-briefcase-fill"></i>
                JobPortal

            </a>

            <div>

                <a href="jobs.html" class="nav-link">
                    Find Jobs
                </a>

            </div>

        </div>

    </div>

</nav>


<!-- Main -->

<section class="page-section">

    <div class="container">

        <div class="page-title">

            <h1>My Applications</h1>

            <p>
                Track all the jobs you have applied for.
            </p>

        </div>


        <!-- Error -->

        <div
            id="errorBox"
            class="error-box mb-4">
        </div>


        <!-- Loading -->

        <div
            id="loadingBox"
            class="loading">

            <i class="bi bi-arrow-repeat"></i>

            <p class="mt-3">
                Loading your applications...
            </p>

        </div>


        <!-- Applications -->

        <div
            id="applicationsContainer"
            style="display:none;">
        </div>


        <!-- Empty -->

        <div
            id="emptyBox"
            class="empty-box"
            style="display:none;">

            <i class="bi bi-file-earmark-text"></i>

            <h3>
                No Applications Yet
            </h3>

            <p>
                You haven't applied for any jobs yet.
            </p>

            <a
                href="jobs.html"
                class="browse-btn">

                <i class="bi bi-search"></i>
                Browse Jobs

            </a>

        </div>

    </div>

</section>


<!-- Footer -->

<footer>

    <div class="container text-center">

        <p>
            © 2026 JobPortal. All Rights Reserved.
        </p>

    </div>

</footer>


<script>


    /* Get Logged User */

    function getLoggedUser() {

        const user =
            JSON.parse(
                sessionStorage.getItem("loggedInUser")
            ) ||
            JSON.parse(
                localStorage.getItem("loggedInUser")
            );

        if (!user) {

            window.location.href =
                "login.html";

            return null;
        }

        return user;
    }


    /* Load Applications */

    async function loadApplications() {

        const user =
            getLoggedUser();

        if (!user) {
            return;
        }


        const email =
            sessionStorage.getItem(
                "userEmail"
            );

        const password =
            sessionStorage.getItem(
                "userPassword"
            );


        if (!email || !password) {

            showError(
                "Login session expired. Please login again."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "http://localhost:8080/api/applications/user/" +
                    user.id,
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                "Basic " +
                                btoa(
                                    email +
                                    ":" +
                                    password
                                )

                        }

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load applications"
                );

            }


            const applications =
                await response.json();


            document.getElementById(
                "loadingBox"
            ).style.display = "none";


            if (
                !applications ||
                applications.length === 0
            ) {

                document.getElementById(
                    "emptyBox"
                ).style.display = "block";

                return;
            }


            displayApplications(
                applications
            );


        } catch (error) {

            console.error(error);

            document.getElementById(
                "loadingBox"
            ).style.display = "none";

            showError(
                "Unable to load your applications. Please try again."
            );

        }

    }


    /* Display Applications */

    function displayApplications(
        applications
    ) {

        const container =
            document.getElementById(
                "applicationsContainer"
            );


        container.innerHTML = "";


        applications.forEach(
            function(application) {

                const status =
                    application.status ||
                    "PENDING";


                let statusClass =
                    "status-pending";


                if (
                    status.toUpperCase() ===
                    "APPROVED"
                ) {

                    statusClass =
                        "status-approved";

                } else if (
                    status.toUpperCase() ===
                    "REJECTED"
                ) {

                    statusClass =
                        "status-rejected";

                } else if (
                    status.toUpperCase() ===
                    "UNDER REVIEW"
                ) {

                    statusClass =
                        "status-review";

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "application-card";


                card.innerHTML = `

                    <div class="row align-items-center g-3">

                        <div class="col-auto">

                            <div class="job-icon">

                                <i class="bi bi-building"></i>

                            </div>

                        </div>


                        <div class="col">

                            <div class="job-title">

                                Job Application #${application.id || ""}

                            </div>

                            <div class="job-info">

                                <i class="bi bi-briefcase"></i>

                                Job ID:
                                ${application.jobId || "N/A"}

                            </div>

                            <div class="date mt-2">

                                <i class="bi bi-calendar3"></i>

                                Applied Date:
                                ${application.appliedDate || "N/A"}

                            </div>


                            <div class="resume-box">

                                <i class="bi bi-file-earmark-pdf"></i>

                                ${application.resume || "Resume uploaded"}

                            </div>

                        </div>


                        <div class="col-md-auto">

                            <span class="status ${statusClass}">

                                ${status}

                            </span>

                        </div>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


        container.style.display =
            "block";

    }


    /* Error */

    function showError(message) {

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        errorBox.innerText =
            message;

        errorBox.style.display =
            "block";

    }


    /* Start */

    loadApplications();


</script>


</body>

</html>
